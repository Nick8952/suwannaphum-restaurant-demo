# Prüft die Website bei jedem Push auf main: Inhalte, Zeitlogik, Lint, Typen, Import-Trockenlauf, statischer Export,
# Exportprüfung, Browser-Prüfungen und das Studio. Veröffentlicht wird nicht hier: Die Website läuft seit dem 21.10.2026 auf
# Vercel (www.suwannaphum.ch), das bei jedem Push selbst baut (SITE_URL und INDEXIERUNG sind dort als Variablen gesetzt).
# Der Export hier entsteht ohne diese Variablen (Vorschau-Modus mit noindex) und braucht keine Geheimnisse.
name: Prüfungen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefungen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Inhalte (Schema, Schreibweise, Speisekarte, Zeiten, Links, Bilder), Lint, Typen
      - run: npm run pruefen
      # Import nach Sanity als Trockenlauf: Dokumente bauen und mit den lokalen Inhalten vergleichen (schreibt nichts)
      - run: npm run seed -- --probe
      # BASE_PATH ist im Code als /suwannaphum-restaurant-demo voreingestellt (lib/deploy-ziel.ts);
      # hier zur Sicherheit aus dem Repository-Namen abgeleitet.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - run: npm run export:pruefen
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      # Browser-Prüfungen gegen den fertigen Export (Chrome ist auf ubuntu-latest vorinstalliert)
      - run: (node scripts/vorschau-server.mjs > /tmp/vorschau.log 2>&1 &) && sleep 2 && npm run qa
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          BASE: http://localhost:4321/${{ github.event.repository.name }}
          CHROME_PATH: /usr/bin/google-chrome

  # Das vorbereitete Sanity Studio muss kompilieren und ein gültiges Schema haben (ohne Sanity-Projekt prüfbar).
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run schema:pruefen
        env:
          SANITY_STUDIO_PROJECT_ID: probe0000
